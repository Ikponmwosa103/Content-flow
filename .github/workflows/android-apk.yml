name: Build ContentFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk-wrapper

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # The runner does not have pnpm installed yet; disable setup-node's
          # automatic package-manager cache detection (it invokes pnpm here).
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Invoke pnpm through npx so the workflow does not depend on a global
      # executable being added to PATH by an installation step.
      - name: Verify toolchain
        run: |
          node --version
          npm --version
          npx --yes pnpm@12.15.0 --version
          java -version

      - name: Install workspace dependencies
        run: npx --yes pnpm@12.15.0 install --no-frozen-lockfile

      - name: Build web frontend
        run: npx --yes pnpm@12.15.0 --filter @workspace/contentflow-ai run build

      - name: Add Capacitor tooling to the app workspace
        run: npx --yes pnpm@12.15.0 --filter @workspace/contentflow-ai add @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        run: npx --yes pnpm@12.15.0 --filter @workspace/contentflow-ai exec cap add android

      - name: Sync Android project
        run: npx --yes pnpm@12.15.0 --filter @workspace/contentflow-ai exec cap sync android

      - name: Build installable debug APK
        working-directory: artifacts/contentflow-ai/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContentFlow-AI-Android-APK
          path: artifacts/contentflow-ai/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
