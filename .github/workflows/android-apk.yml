name: Build ContentFlow Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @workspace/contentflow-ai run build

      # Install through pnpm because this is a pnpm workspace package and its
      # manifest contains workspace: dependencies (npm install cannot resolve them).
      - name: Add Capacitor tooling to the app workspace
        run: pnpm --filter @workspace/contentflow-ai add @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        run: pnpm --filter @workspace/contentflow-ai exec cap add android

      - name: Sync Android project
        run: pnpm --filter @workspace/contentflow-ai exec cap sync android

      - name: Build installable debug APK
        working-directory: artifacts/contentflow-ai/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContentFlow-AI-Android-APK
          path: artifacts/contentflow-ai/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
